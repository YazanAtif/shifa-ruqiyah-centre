plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shifaruqiyah.app'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["target"]
    productFlavors {
        client {
            dimension "target"
            applicationId "com.shifaruqiyah.app"
            manifestPlaceholders = [appName: "Shifa Ruqiyah"]
            buildConfigField "String", "DEFAULT_URL", "\"https://src-online.com\""
        }
        admin {
            dimension "target"
            applicationId "com.shifaruqiyah.admin"
            manifestPlaceholders = [appName: "SRC Admin"]
            buildConfigField "String", "DEFAULT_URL", "\"https://src-online.com/admin\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
